<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>InstaPlayCompose</title>
    <script>
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (lang.startsWith('ja')) {
        window.location.replace('./ja/');
      } else {
        window.location.replace('./en/');
      }
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=./ja/">
    </noscript>
  </head>
  <body>
    <p>Redirecting to <a href="./ja/">日本語版</a> / <a href="./en/">English version</a>...</p>
  </body>
</html>
